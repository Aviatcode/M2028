<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M2028 — Blocked</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --accent: #4fd8a0;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, var(--bg2), var(--bg1));
    color: var(--text);
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 440px; width: 100%; }
  .emoji { font-size: 56px; margin-bottom: 8px; animation: pop 0.5s ease; }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .domain { color: var(--accent); font-weight: 700; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .bar-track { width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 20px; }
  .bar-fill { height: 100%; width: 0%; background: var(--accent); animation: fill 1.1s linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, a.btn { font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
  .primary { background: var(--accent); color: #063b2a; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.15); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji" id="emoji">🚫</div>
    <h1 id="headline">This site is off-limits right now</h1>
    <p class="sub" id="subline">Taking you somewhere better…</p>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div class="btn-row">
      <a href="#" class="btn primary" id="goNowBtn">Take me there now →</a>
      <a href="options.html" target="_blank" class="btn ghost">Change this redirect</a>
    </div>
    <footer>M2028 • Blocked by your own settings — <a href="options.html" target="_blank">edit limits</a></footer>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
